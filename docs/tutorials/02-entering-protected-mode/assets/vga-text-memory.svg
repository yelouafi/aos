<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="vga-title vga-desc">
  <title id="vga-title">Character and attribute bytes in VGA text memory</title>
  <desc id="vga-desc">Beginning at address B8000, each screen cell contains a character byte followed by an attribute byte. The example stores the characters H and i with attribute 07 for light gray text on black.</desc>

  <rect width="1120" height="430" fill="#ffffff"/>
  <text x="560" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">VGA text memory: two bytes per screen cell</text>

  <rect x="75" y="105" width="205" height="100" rx="12 0 0 12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="177" y="141" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#1d4ed8">0xB8000</text>
  <text x="177" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#1e3a8a">'H'</text>

  <rect x="280" y="105" width="205" height="100" fill="#fef3c7" stroke="#ca8a04" stroke-width="3"/>
  <text x="382" y="141" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#a16207">0xB8001</text>
  <text x="382" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#854d0e">07</text>

  <rect x="485" y="105" width="205" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="587" y="141" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#1d4ed8">0xB8002</text>
  <text x="587" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#1e3a8a">'i'</text>

  <rect x="690" y="105" width="205" height="100" fill="#fef3c7" stroke="#ca8a04" stroke-width="3"/>
  <text x="792" y="141" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#a16207">0xB8003</text>
  <text x="792" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#854d0e">07</text>

  <rect x="895" y="105" width="150" height="100" rx="0 12 12 0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
  <text x="970" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#64748b">...</text>

  <path d="M177,215 L177,263 L587,263 L587,215" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="382" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">character bytes</text>

  <path d="M382,215 L382,329 L792,329 L792,215" fill="none" stroke="#ca8a04" stroke-width="3"/>
  <text x="587" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#854d0e">attribute bytes</text>

  <rect x="770" y="275" width="275" height="112" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="907" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Attribute 0x07</text>
  <text x="907" y="340" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#475569">background 000 = black</text>
  <text x="907" y="369" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#475569">foreground 0111 = light gray</text>

  <text x="335" y="403" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">80 × 25 cells × 2 bytes = 4,000 bytes</text>
</svg>
