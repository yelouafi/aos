<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="register-title register-desc">
  <title id="register-title">Registers connect the CPU to data and the stack in memory</title>
  <desc id="register-desc">Inside the CPU, AX, BX, SI, DS, SS, SP, IP, and FLAGS hold immediate working values. DS and SI locate message bytes in RAM, while SS and SP locate the top of the stack.</desc>
  <defs>
    <marker id="register-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="register-arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1120" height="520" fill="#ffffff"/>
  <text x="560" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Registers are the CPU's immediate workspace</text>

  <rect x="40" y="80" width="525" height="390" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="302" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Inside the CPU</text>

  <rect x="75" y="150" width="205" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="177" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#1e3a8a">AX</text>
  <line x1="177" y1="184" x2="177" y2="216" stroke="#93c5fd" stroke-width="2"/>
  <text x="126" y="207" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">AH</text>
  <text x="229" y="207" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">AL</text>

  <rect x="325" y="150" width="205" height="76" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="427" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#334155">BX</text>
  <text x="427" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">additional working value</text>

  <rect x="75" y="252" width="205" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="177" y="282" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#1e3a8a">DS : SI</text>
  <text x="177" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">next message byte</text>

  <rect x="325" y="252" width="205" height="76" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="427" y="282" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#9a3412">SS : SP</text>
  <text x="427" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">top of the stack</text>

  <rect x="75" y="354" width="205" height="76" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="177" y="384" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#334155">IP</text>
  <text x="177" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">next instruction</text>

  <rect x="325" y="354" width="205" height="76" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="427" y="384" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#334155">FLAGS</text>
  <text x="427" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">results and CPU state</text>

  <rect x="670" y="80" width="410" height="390" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="875" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#0f172a">RAM</text>

  <rect x="710" y="150" width="330" height="132" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="735" y="178" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">0x7C00</text>
  <text x="875" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">boot-sector code and data</text>
  <rect x="755" y="228" width="240" height="36" rx="7" fill="#dbeafe"/>
  <text x="875" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">"Peace be upon you!" 00</text>

  <rect x="710" y="326" width="330" height="104" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="735" y="355" font-family="ui-monospace, monospace" font-size="15" fill="#c2410c">near 0x9FFFF</text>
  <rect x="755" y="371" width="240" height="38" rx="7" fill="#ffedd5"/>
  <text x="875" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#9a3412">saved values and return addresses</text>

  <path d="M280,290 C430,290 555,215 698,215" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#register-arrow-blue)"/>
  <text x="560" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">locates data</text>

  <path d="M530,290 C600,290 620,378 698,378" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#register-arrow-orange)"/>
  <text x="618" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#c2410c">locates stack</text>

  <text x="560" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">registers hold locations and values · RAM holds the larger program state</text>
</svg>
