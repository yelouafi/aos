<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" role="img" aria-labelledby="boot-flow-title boot-flow-desc">
  <title id="boot-flow-title">From BIOS firmware to boot-sector output</title>
  <desc id="boot-flow-desc">The BIOS selects a boot device and reads sector one. The sector is loaded at physical address 7C00, where its 16-bit code calls BIOS interrupt 10h to print a message.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1120" height="330" fill="#ffffff"/>

  <rect x="28" y="70" width="270" height="170" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="163" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">BIOS firmware</text>
  <text x="163" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">selects the boot device</text>
  <text x="163" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">reads disk sector 1</text>
  <text x="163" y="215" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#1d4ed8">512 bytes</text>

  <line x1="298" y1="155" x2="397" y2="155" stroke="#64748b" stroke-width="4" marker-end="url(#flow-arrow)"/>

  <rect x="410" y="40" width="300" height="230" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="560" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Boot sector</text>
  <text x="560" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#475569">physical 0x7C00</text>
  <text x="560" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">16-bit real-mode code</text>
  <rect x="468" y="191" width="184" height="45" rx="10" fill="#e2e8f0"/>
  <text x="560" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#0f172a">signature 55 AA</text>

  <line x1="710" y1="155" x2="809" y2="155" stroke="#64748b" stroke-width="4" marker-end="url(#flow-arrow)"/>

  <rect x="822" y="70" width="270" height="170" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="957" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#065f46">Screen output</text>
  <text x="957" y="153" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#047857">INT 10h / AH=0Eh</text>
  <text x="957" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">prints one character</text>
  <text x="957" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">at a time</text>

  <text x="560" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">firmware -&gt; sector 1 -&gt; physical 0x7C00 -&gt; BIOS video service</text>
</svg>
