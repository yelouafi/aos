<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="disk-title disk-desc">
  <title id="disk-title">Tracks, sectors, heads, and a cylinder</title>
  <desc id="disk-desc">The left panel shows concentric tracks divided into sectors. The right panel shows platter surfaces stacked vertically and tracks at the same radius forming a cylinder.</desc>

  <rect width="1120" height="520" fill="#ffffff"/>

  <rect x="20" y="20" width="520" height="470" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="280" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">One disk surface</text>

  <path d="M280 255 L280 95 A160 160 0 0 1 418.56 175 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="280" cy="255" r="160" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="280" cy="255" r="130" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="280" cy="255" r="100" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="280" cy="255" r="70" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="280" cy="255" r="38" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <line x1="280" y1="95" x2="280" y2="217" stroke="#94a3b8" stroke-width="2"/>
  <line x1="418.56" y1="175" x2="312.91" y2="236" stroke="#94a3b8" stroke-width="2"/>
  <line x1="440" y1="255" x2="318" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="393.14" y1="368.14" x2="306.87" y2="281.87" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="415" x2="280" y2="293" stroke="#94a3b8" stroke-width="2"/>
  <line x1="166.86" y1="368.14" x2="253.13" y2="281.87" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="255" x2="242" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="166.86" y1="141.86" x2="253.13" y2="228.13" stroke="#94a3b8" stroke-width="2"/>

  <line x1="414" y1="128" x2="458" y2="96" stroke="#d97706" stroke-width="2"/>
  <text x="465" y="98" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#92400e">sector</text>
  <line x1="390" y1="322" x2="465" y2="355" stroke="#2563eb" stroke-width="2"/>
  <text x="468" y="361" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">track</text>
  <text x="280" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">Sectors start at 1</text>

  <rect x="580" y="20" width="520" height="470" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="840" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Several platter surfaces</text>

  <ellipse cx="840" cy="155" rx="185" ry="58" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="840" cy="245" rx="185" ry="58" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <ellipse cx="840" cy="335" rx="185" ry="58" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

  <ellipse cx="840" cy="155" rx="98" ry="31" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <ellipse cx="840" cy="245" rx="98" ry="31" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <ellipse cx="840" cy="335" rx="98" ry="31" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <line x1="742" y1="155" x2="742" y2="335" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="938" y1="155" x2="938" y2="335" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 8"/>

  <line x1="945" y1="245" x2="1030" y2="245" stroke="#7c3aed" stroke-width="2"/>
  <text x="1034" y="251" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#6d28d9">cylinder</text>
  <text x="840" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">Heads and cylinders start at 0</text>
</svg>
