<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="register-title register-desc">
  <title id="register-title">Segment:offset pairs connect the CPU to code, data, and the stack in RAM</title>
  <desc id="register-desc">Inside the CPU, AX and BX hold immediate working values. CS:IP locates the next instruction at EntryPoint, DS:SI locates the next message byte, and SS:SP locates the top of the stack. FLAGS records the result of the last comparison.</desc>
  <defs>
    <marker id="register-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="register-arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="register-arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1120" height="520" fill="#ffffff"/>
  <text x="560" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Three register pairs, three places in RAM</text>

  <rect x="40" y="72" width="525" height="398" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="302" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Inside the CPU</text>

  <rect x="75" y="140" width="205" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="177" y="167" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#1e3a8a">AX</text>
  <line x1="177" y1="174" x2="177" y2="204" stroke="#93c5fd" stroke-width="2"/>
  <text x="126" y="197" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">AH</text>
  <text x="229" y="197" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">AL</text>

  <rect x="325" y="140" width="205" height="76" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="427" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#334155">BX</text>
  <text x="427" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">additional working value</text>

  <rect x="75" y="240" width="205" height="76" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="177" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#5b21b6">CS : IP</text>
  <text x="177" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6d28d9">next instruction</text>

  <rect x="325" y="240" width="205" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="427" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#1e3a8a">DS : SI</text>
  <text x="427" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">next message byte</text>

  <rect x="75" y="340" width="205" height="76" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="177" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#9a3412">SS : SP</text>
  <text x="177" y="397" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">top of the stack</text>

  <rect x="325" y="340" width="205" height="76" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="427" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#334155">FLAGS</text>
  <text x="427" y="397" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">results and CPU state</text>

  <rect x="670" y="72" width="410" height="398" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="875" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">RAM</text>

  <rect x="710" y="140" width="330" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="731" y="166" font-family="ui-monospace, monospace" font-size="14" fill="#1d4ed8">0x7C00</text>
  <rect x="850" y="153" width="172" height="24" rx="6" fill="#ede9fe"/>
  <text x="936" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5b21b6">EntryPoint</text>
  <text x="875" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">boot-sector code and data</text>
  <rect x="755" y="222" width="240" height="36" rx="7" fill="#dbeafe"/>
  <text x="875" y="245" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1d4ed8">"Peace be upon you!" 00</text>

  <rect x="710" y="334" width="330" height="104" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="731" y="363" font-family="ui-monospace, monospace" font-size="14" fill="#c2410c">near 0x9FFFF</text>
  <rect x="755" y="379" width="240" height="38" rx="7" fill="#ffedd5"/>
  <text x="875" y="403" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#9a3412">saved values and return addresses</text>

  <path d="M280,278 C420,278 480,168 698,168" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#register-arrow-violet)"/>
  <text x="500" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">fetches code</text>

  <path d="M530,278 C610,278 630,238 698,238" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#register-arrow-blue)"/>
  <text x="640" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">locates data</text>

  <path d="M280,378 C480,378 560,386 698,386" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#register-arrow-orange)"/>
  <text x="500" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#c2410c">locates stack</text>

  <text x="560" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">every segment register works paired with an offset register - never alone</text>
</svg>
